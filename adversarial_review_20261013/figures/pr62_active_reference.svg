  <g id="text_14">
   <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="43.2" y="70.2" transform="rotate(-0 43.2 70.2)">When sources are active, include only their nominal rates. When all are off, use the nominal fallback.</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #147f89" x="86.4" y="424.008" transform="rotate(-0 86.4 424.008)">All-off reference: continuous run = fresh restart = nominal fallback.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263940" x="86.4" y="466.128" transform="rotate(-0 86.4 466.128)">The fallback avoids retaining a reference that depends on the preceding emission situation.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="86.4" y="497.016" transform="rotate(-0 86.4 497.016)">* Rounded fixture values; residual mass is approximately 100, with K = 10. Source activation uses factor &gt; 0.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="86.4" y="523.9728" transform="rotate(-0 86.4 523.9728)">A positive factor's magnitude does not weight the nominal rate. More trajectories change sampling, not emitted mass.</text>
  </g>
  <g id="text_19">
