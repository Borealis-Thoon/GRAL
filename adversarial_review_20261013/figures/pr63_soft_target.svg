  <g id="text_26">
   <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="43.2" y="70.2" transform="rotate(-0 43.2 70.2)">Start at K = 10; increase K only if needed; stop after at most six adjustments.</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263940" x="75.6" y="435.24" transform="rotate(-0 75.6 435.24)">The target is not a hard cap: retained entries and the adjustment limit can keep the total above it.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="75.6" y="480.168" transform="rotate(-0 75.6 480.168)">Every eligible entry keeps at least one trajectory. Larger K reduces subdivision and can increase sampling noise.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="75.6" y="511.056" transform="rotate(-0 75.6 511.056)">The prepass adds grid scans; cases already below the target keep K = 10.</text>
  </g>
  <g id="text_30">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637680" x="75.6" y="540.8208" transform="rotate(-0 75.6 540.8208)">Actual DLL planning fixtures. Predicted counts are not a measured whole-model speedup or an accuracy estimate.</text>
