  <g id="text_14">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20343d" x="48.6" y="39.067312" transform="rotate(-0 48.6 39.067312)">#69  Reuse the index when the same height is requested again</text>
  </g>
  <g id="text_15">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="48.6" y="68.452875" transform="rotate(-0 48.6 68.452875)">The particle's vertical grid stays fixed. A changed height still uses the original search.</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20343d" x="48.6" y="110.696484" transform="rotate(-0 48.6 110.696484)">Observed in two synthetic terrain projects</text>
  </g>
  <g id="text_17">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="48.6" y="135.484875" transform="rotate(-0 48.6 135.484875)">889,446 calls on the instrumented cache path; NKK = 39</text>
  </g>
  <g id="text_18">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="81" y="263.13307" transform="rotate(-0 81 263.13307)">About 50% of these lookups reused an index. This is a call count, not a runtime reduction.</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20343d" x="48.6" y="307.688484" transform="rotate(-0 48.6 307.688484)">Measured lookup time in separate synthetic benchmarks</text>
  </g>
  <g id="text_20">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="48.6" y="334.009266" transform="rotate(-0 48.6 334.009266)">Baseline = 100%. Lower is faster. Ranges span conditions; each value is a seven-round median.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="291.6" y="534.975363" transform="rotate(-0 291.6 534.975363)">29 of 30 changing-height cases were slower; the orange dot is the faster exception.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="48.6" y="582.301266" transform="rotate(-0 48.6 582.301266)">The 50% repeat sequences are synthetic, not a replay of the observed Main heights.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647780" x="48.6" y="611.029266" transform="rotate(-0 48.6 611.029266)">Benchmarks include cache preparation. Main counters measure routing and alter timing.</text>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20343d" x="48.6" y="641.644875" transform="rotate(-0 48.6 641.644875)">Benefit depends on repeated heights. Complete GRAL speedup was not measured.</text>
  </g>
 </g>
