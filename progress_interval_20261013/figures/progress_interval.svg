   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243444" x="47.52" y="29.376" transform="rotate(-0 47.52 29.376)">A zero progress interval can leave particles unprocessed</text>
  </g>
  <g id="text_37">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536575" x="47.52" y="57.2832" transform="rotate(-0 47.52 57.2832)">Fixed seeds, six particles. The one-line guard keeps the interval at one or more.</text>
  </g>
  <g id="text_38">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243444" x="47.52" y="428.4" transform="rotate(-0 47.52 428.4)">Before: index % 0 interrupts each worker after its first particle. The existing catch hides the exception.</text>
  </g>
  <g id="text_39">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536575" x="47.52" y="452.88" transform="rotate(-0 47.52 452.88)">After: all six particles are processed. Values shown are medians of three repeats; release values come from the engine log.</text>
  </g>
 </g>
